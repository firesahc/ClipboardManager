plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clipboard.enhance'
    compileSdk 34

    defaultConfig {
        applicationId "com.clipboard.enhance"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Xposed API：仅编译期引用，运行时由 LSPosed 提供
    compileOnly files("${rootProject.projectDir}/libs/xposed-api-89.jar")
}